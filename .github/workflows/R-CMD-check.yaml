# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: macOS-latest # ubuntu too slow
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://bgreenwell.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Include vdiffr snapshots in CI build
        run: |
          # keep tarball small for CRAN but let CI compare against baselines
          perl -i -ne 'print unless /_snaps/' .Rbuildignore
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"note"'
